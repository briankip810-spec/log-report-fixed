artifacts = ["/app/report.json"]

[task]
name = "dynamo/log-report"
description = "Parse an Apache-style access log into a JSON summary report."

[metadata]
category = "data_processing_and_etl"
subcategory = "text_processing"
task_objective = ["transform", "generate"]
artifact_type = ["generated_output_artifact"]
expert_time_estimate_hours = 0.3
model_tested = "gpt-5.4"
agent_tested = "terminus-2"
difficulty_explanation = "The task requires parsing an Apache access log and generating a JSON summary."
solution_explanation = "Read the log, count total requests, count unique client IPs, determine the most frequently requested path, and write the results to report.json."
verification_explanation = "The verifier checks that report.json exists and that all expected values are correct."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 120.0

[environment]
